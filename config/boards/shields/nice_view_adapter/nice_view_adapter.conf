# Enable the official nice!view status widgets
CONFIG_NICE_VIEW_WIDGET_STATUS=y

# Disable standard ZMK widgets that conflict with nice!view's custom widgets
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=n

# Disable custom and built-in OLED status screens for nice!view builds
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=n
CONFIG_SOFLE_CUSTOM_DISPLAY=n
